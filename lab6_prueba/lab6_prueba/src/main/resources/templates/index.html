<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de la Cacatúa</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="d-flex align-items-start gap-4">
        
        <!-- LLAMAMOS AL FRAGMENTO DEL TABLERO -->
        <!-- Le pasamos la matriz que vino envuelta en nuestro DTO -->
        <div th:replace="~{fragments/componentes :: tableroFrag(${dto.matriz})}"></div>

        <!-- LLAMAMOS AL FRAGMENTO DEL PANEL DE BOTONES -->
        <!-- Le pasamos los picotazos que vinieron envueltos en nuestro DTO -->
        <div th:replace="~{fragments/componentes :: panelFrag(${dto.picotazosRestantes})}"></div>
        
    </div>

</body>
</html>
